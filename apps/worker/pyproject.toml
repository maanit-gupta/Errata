[project]
name = "brandlens-worker"
version = "0.1.0"
description = "BrandLens verification worker: queue consumer and review pipeline."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langfuse>=5.0.4",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "psycopg[binary,pool]>=3.3.6",
    "pyahocorasick>=2.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "scikit-image>=0.26.0",
    "supabase>=2.33.0",
    "tenacity>=9.1.4",
    "textstat>=0.7.13",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ocr-paddle = [
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brandlens_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Brand copy is full of typographic quotes, dashes and spaces; we match them on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Fixture strings and SQL in tests and dev scripts read better unwrapped.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["brandlens_worker"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "ahocorasick", "textstat", "trafilatura", "fitz", "pymupdf", "docx", "paddleocr"]
ignore_missing_imports = true

# OpenCV's bundled stubs and scikit-image's partial hints reject valid calls (e.g. ORB_create,
# kmeans on float32 arrays); treat both as Any, like the untyped libraries above.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "skimage", "skimage.*"]
follow_imports = "skip"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # starlette nudges toward httpx2; httpx is fine for TestClient until we decide otherwise.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # PyMuPDF's SWIG bindings on Python 3.12
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__:DeprecationWarning",
]
