name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: make setup

      # Unit tests never read real env files; next typegen/tsc don't need env either.
      - name: Lint and types
        run: make lint

      # The vision tests run real OCR (README: image checks need the Tesseract binary).
      - name: Install Tesseract
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr

      - name: Unit tests
        run: make test-worker test-web

  pgtap:
    # Migrations from zero + seed, then pgTAP (RLS, state machine, queue, retrieval).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database (applies migrations and seed.sql)
        run: supabase db start
      - name: pgTAP
        run: supabase test db
      - name: Schema lint
        run: supabase db lint --level error

  worker-image:
    # The Render image builds (and bakes the embedding model). E2E is manual: it needs the worker
    # with LLM keys; run `E2E_WORKER=1 pnpm exec playwright test` locally or E2E_BASE_URL=… .
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t brandlens-worker apps/worker

  # The golden-set eval gate lives in eval.yml (path-filtered; needs LLM secrets).
